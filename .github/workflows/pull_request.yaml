name: Run tests

on:
  pull_request:
    branches:
      - master
      - v*

jobs:
  run_tests:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -r requirements.txt

    - name: Checking formatting with black
      if: runner.os == 'Linux'
      run: |
        black --check ./play ./tests

    - name: Analysing the code with pylint
      if: runner.os == 'Linux'
      run: |
        pylint $(git ls-files 'play/*.py' 'play/**/*.py')

    - name: Run tests
      run: pytest ./tests -n auto -v --runslow --durations=10

  raspberry_pi:
    name: Raspberry Pi OS ${{ matrix.release }} (64-bit)
    strategy:
      fail-fast: false
      matrix:
        release: [bookworm, trixie]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container: debian:${{ matrix.release }}
    steps:
    - name: Install the Python that Raspberry Pi OS ships
      run: |
        apt-get update
        apt-get install -y --no-install-recommends python3 python3-venv git ca-certificates fontconfig fonts-dejavu-core
        python3 --version

    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        python3 -m venv /opt/venv
        /opt/venv/bin/pip install -r requirements-dev.txt -r requirements.txt

    - name: Run tests
      run: /opt/venv/bin/python -m pytest ./tests -n auto -v --runslow --durations=10

  pygbag:
    name: In the browser (pygbag)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Run the tests with the pymunk and numpy that pygbag provides
      run: |
        python -m pip install --upgrade pip
        grep -v -e pymunk -e numpy requirements.txt > "$RUNNER_TEMP/requirements-pygbag.txt"
        pip install -r requirements-dev.txt -r "$RUNNER_TEMP/requirements-pygbag.txt" pymunk==6.4.0 numpy==2.0.2
        pytest ./tests -n auto --runslow

    - name: Install pygbag and Playwright
      run: |
        pip install pygbag==0.9.3 playwright==1.56.0
        python -m playwright install --with-deps chromium

    - name: Build a play game with pygbag
      run: |
        cp -r play tools/browser/game/play
        python -m pygbag --build --ume_block 0 tools/browser/game

    - name: Run it in Chromium
      run: python tools/browser/run_in_chromium.py tools/browser/game/build/web

  pyodide:
    name: In the browser (Pyodide ${{ matrix.pyodide }})
    strategy:
      fail-fast: false
      matrix:
        pyodide: ["0.29.5", "314.0.7"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install build and Playwright
      run: |
        python -m pip install --upgrade pip
        pip install build==1.3.0 playwright==1.56.0
        python -m playwright install --with-deps chromium

    - name: Build the play wheel and the page that installs it with micropip
      run: |
        python -m build --wheel --outdir "$RUNNER_TEMP/site"
        sed "s|/pyodide/v[0-9.]*/|/pyodide/v${{ matrix.pyodide }}/|" tools/browser/pyodide/index.html > "$RUNNER_TEMP/site/index.html"
        grep -q "/pyodide/v${{ matrix.pyodide }}/" "$RUNNER_TEMP/site/index.html"
        cp tools/browser/game/main.py "$RUNNER_TEMP/site/"
        (cd "$RUNNER_TEMP/site" && ls *.whl > wheel.txt)

    - name: Run it in Chromium
      run: python tools/browser/run_in_chromium.py "$RUNNER_TEMP/site"
