name: Run tests

on:
  pull_request:
    branches:
      - master
      - v*

jobs:
  run_tests:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -r requirements.txt

    - name: Checking formatting with black
      if: runner.os == 'Linux'
      run: |
        black --check ./play ./tests

    - name: Analysing the code with pylint
      if: runner.os == 'Linux'
      run: |
        pylint $(git ls-files 'play/*.py' 'play/**/*.py')

    - name: Run tests
      run: pytest ./tests -n auto -v --runslow --durations=10

  raspberry_pi:
    name: Raspberry Pi OS ${{ matrix.release }} (64-bit)
    strategy:
      matrix:
        release: [bookworm, trixie]
    runs-on: ubuntu-24.04-arm
    container: debian:${{ matrix.release }}
    steps:
    - name: Install the Python that Raspberry Pi OS ships
      run: |
        apt-get update
        apt-get install -y --no-install-recommends python3 python3-venv git ca-certificates
        python3 --version

    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        python3 -m venv /opt/venv
        /opt/venv/bin/pip install -r requirements-dev.txt -r requirements.txt

    - name: Run tests
      run: /opt/venv/bin/python -m pytest ./tests -n auto -v --runslow --durations=10

  pygbag:
    name: In the browser (pygbag)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install pygbag and Playwright
      run: |
        python -m pip install --upgrade pip
        pip install pygbag==0.9.3 playwright==1.56.0
        python -m playwright install --with-deps chromium

    - name: Build a play game with pygbag
      run: |
        cp -r play tools/pygbag/game/play
        python -m pygbag --build --ume_block 0 tools/pygbag/game

    - name: Run it in Chromium
      run: python tools/pygbag/run_in_chromium.py tools/pygbag/game/build/web
